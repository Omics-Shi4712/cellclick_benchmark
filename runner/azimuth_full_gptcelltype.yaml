run:
  output_dir: ../runs/azimuth_full_gptcelltype_normalized
  conda_executable: conda

data:
  tableAdapter:
    marker_adapter_config: ../data/marker_list/celltypegpt/celltype.config.json
    selection:
      - dataset: Azimuth

callers:
  gptcelltype:
    implementation: gptcelltype
    enabled: true
    environment: gptcelltype
    model: gpt-4o
    batch_size: 30

evaluation:
  type: celltypegpt
