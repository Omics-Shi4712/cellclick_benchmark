run:
  output_dir: ../../runs/azimuth_full_cassia
  conda_executable: conda

data:
  marker_adapter_config: ../../data/marker_list/cissia/cassia.config.json
  selection:
    - dataset: Azimuth

callers:
  cassia:
    implementation: cassia
    enabled: true
    environment: cassia
    model: gpt-4o
    provider: openai
    max_workers: 4
    max_retries: 2

evaluation:
  type: cassia
