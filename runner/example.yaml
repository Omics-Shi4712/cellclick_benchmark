run:
  output_dir: ../runs/example_benchmark
  conda_executable: conda
  # Maximum number of independent expression/caller tasks to run concurrently.
  # Keep this at 1 for serial execution; API callers may need a lower value
  # than their own method-level worker settings.
  max_parallel_tasks: 1

data:
  # Expression marker_method supports wilcoxon-seurat-v2-pos-neg and
  # wilcoxon-seurat-v2-pos-neutral for balanced class-stratified marker sets.
  tableAdapter:
    marker_adapter_config: ../data/marker_list/celltypegpt/celltype.config.json
    # Optional override; CASSIA otherwise uses data/expression_data/h5ad_metadata.json.
    dataset_metadata_file: ../data/expression_data/h5ad_metadata.json
    selection:
      - dataset: Azimuth
    # Optional: remove documented source rows before method tasks and scoring.
    # exclude_source_row_ids:
    #   - row_0051

callers:
  # anndict:
  #   # Requires data.expressionAdapter and marker_generator: anndict.
  #   implementation: anndict
  #   enabled: true
  #   environment: adt
  #   provider: openai
  #   model: gpt-4o-2024-08-06
  #   # api_key_env: OPENAI_API_KEY
  cassia:
    implementation: cassia
    enabled: true
    environment: cassia
    model: gpt-4o
    provider: openai
    # Pipeline scores before Boost; clusters with Score < this threshold enter Boost.
    score_threshold: 75
    max_workers: 4
    max_retries: 2
  gptcelltype:
    implementation: gptcelltype
    enabled: true
    environment: gptcelltype
    model: gpt-4o
    batch_size: 30
    # For an OpenAI-compatible relay, configure its non-secret endpoint here.
    # base_url: https://relay.example.com/v1
    # The key stays in this environment variable and is never written to a task.
